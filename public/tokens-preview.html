<!doctype html>
<meta charset="utf-8">
<title>Arte de tokens — hoja de contactos</title>
<style>
  body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #fff; color: #000; }
  h1 { text-align: center; font-size: 18px; margin: 16px 0 0; }
  p { text-align: center; font-size: 12px; color: #7a7a7a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-width: 760px; margin: 16px auto; padding: 0 16px; }
  .cell { border: 2.5px solid #000; border-radius: 12px; padding: 8px; text-align: center; }
  img { width: 100%; aspect-ratio: 1; object-fit: contain; }
  .name { font-size: 12px; font-weight: 700; }
</style>
<h1>public/tokens/</h1>
<p>Hoja de contactos de las ilustraciones placeholder. Edita la lista en este archivo al agregar arte.</p>
<div class="grid" id="g"></div>
<script>
  const names = ['goblin','bird','clue','spirit','squirrel','elemental','plant','eldrazi-spawn','food','treasure','map','human-soldier'];
  document.getElementById('g').innerHTML = names.map(n =>
    `<div class="cell"><img src="tokens/${n}.svg" alt="${n}"><div class="name">${n}</div></div>`).join('');
</script>
